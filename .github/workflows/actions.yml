name: run main.py

on:
  schedule:
    - cron: '0 12 * * *' # runs at 12:00 everyday
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout repo content
        uses: actions/checkout@v4

      - name: setup uv
        uses: astral-sh/setup-uv@v10

      - name: install dependencies
        run: uv sync --frozen

      # 测试门禁：测试失败则整个任务失败，不会带着坏代码抓取和提交
      - name: run tests
        run: uv run python -m unittest discover -s test

      - name: execute py script
        run: uv run python main.py

      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 只暂存期望修改的文件，避免提交不相关文件
          git add README.md recently_movie_250.json
          git diff-index --quiet HEAD || (git commit -m "Auto updated" --allow-empty)

      - name: push changes
        run: |
          git pull --rebase
          git push
