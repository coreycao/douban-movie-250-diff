name: run archive.py

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 1 * *' # runs at 10:00 on the 1st of every month

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout repo content
        uses: actions/checkout@v4

      - name: setup uv
        uses: astral-sh/setup-uv@v10

      - name: install dependencies
        run: uv sync --frozen

      - name: execute py script
        run: uv run python archive.py

      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 只暂存期望修改的文件，避免提交不相关文件
          git add README.md archive/
          git diff-index --quiet HEAD || (git commit -m "Auto archived." --allow-empty)

      - name: push changes
        run: |
          git pull --rebase
          git push
