name: run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      - name: checkout repo content
        uses: actions/checkout@v4

      - name: setup uv
        uses: astral-sh/setup-uv@v10

      - name: install dependencies
        run: uv sync --frozen

      - name: run tests
        run: uv run python -m unittest discover -s test -v
