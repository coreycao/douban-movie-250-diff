name: tmp outcome test

on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: fail step
        id: a
        run: exit 1

      - name: v1 explicit wrap
        if: ${{ steps.a.outcome == 'failure' }}
        run: echo "V1-TRIGGERED"

      - name: v2 conclusion
        if: steps.a.conclusion == 'failure'
        run: echo "V2-TRIGGERED"

      - name: v3 failure-and-outcome
        if: failure() && steps.a.outcome == 'failure'
        run: echo "V3-TRIGGERED"

      - name: v4 outcome-and-failure
        if: steps.a.outcome == 'failure' && failure()
        run: echo "V4-TRIGGERED"

      - name: dump
        if: always()
        run: echo "outcome=${{ steps.a.outcome }} conclusion=${{ steps.a.conclusion }}"
