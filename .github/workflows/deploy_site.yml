name: Deploy GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["run main.py", "run archive.py"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate site
        run: python generate_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      # continue-on-error：首次失败不把 job 置红，重试成功即整体成功（不发失败邮件）
      # 副作用：此步失败后 failure() 恒为 false，重试条件只能判 outcome
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # deploy-pages 偶发瞬时故障：artifact 上传成功但元数据 API 尚未可见
      # （Found 0 artifacts），等待传播完成后自动重试一次，无需人工 rerun
      - name: Wait for artifact metadata propagation
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
